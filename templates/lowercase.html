{% extends 'base.html' %}
{% block title %}toLowerCase{% endblock %}

{% block content %}
  <a class="back-link" href="{{ url_for('works') }}">&larr; Back to Works</a>
  <h1>toLowerCase</h1>
  <p class="lead">Type some text and see it in lowercase.</p>

  <section class="panel solo">
    <label for="lower-in">Type some text</label>
    <input id="lower-in" type="text" placeholder="HELLO WORLD" autocomplete="off">
    <div class="result" id="lower-out" aria-live="polite">Your text in lowercase appears here.</div>
  </section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='lowercase.js') }}"></script>
{% endblock %}
